name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build, test, validate packages, run AEM analyser
        run: mvn -B clean install
      - name: Byline test report
        if: always()
        run: cat core/target/surefire-reports/*Byline*.txt
